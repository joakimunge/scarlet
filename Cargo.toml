[package]
name = "scarlet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, keyboard-driven terminal client for PostgreSQL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joakimunge/scarlet"
homepage = "https://github.com/joakimunge/scarlet"
readme = "README.md"
keywords = ["postgres", "tui", "database", "terminal", "sql"]
categories = ["command-line-utilities", "database"]
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
native-tls = "0.2.18"
nucleo-matcher = "0.3.1"
postgres-native-tls = "0.5.3"
ratatui = "0.30.2"
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
unicode-width = "0.2.3"

# Release binaries for Linux carry their own OpenSSL, so they run without it installed.
[target.'cfg(target_os = "linux")'.dependencies]
native-tls = { version = "0.2.18", features = ["vendored"] }
