name: Release

# Pushing a tag like v0.2.0 builds the binaries, publishes a GitHub release and
# updates the Homebrew formula. The tag must match the version in Cargo.toml.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=scarlet-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/scarlet README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: scarlet-${{ matrix.target }}.tar.gz*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  homebrew:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-24.04
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the formula
        if: env.TAP_DEPLOY_KEY != ''
        run: dev/formula.sh "${GITHUB_REF_NAME#v}" dist > scarlet.rb
      - name: Push it to the tap
        if: env.TAP_DEPLOY_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:${{ github.repository_owner }}/homebrew-tap.git tap
          mkdir -p tap/Formula && cp scarlet.rb tap/Formula/scarlet.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/scarlet.rb
          git commit -m "scarlet $GITHUB_REF_NAME" && git push
      - name: No tap key
        if: env.TAP_DEPLOY_KEY == ''
        run: echo "::warning::TAP_DEPLOY_KEY is not set, so the Homebrew formula was not updated."
